
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>فزعة | خدمات الفنيين</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f8;color:#17202a;font-family:Tahoma,Arial,sans-serif}
.app{max-width:520px;min-height:100vh;margin:auto;background:white}
.top{background:#0f766e;color:white;padding:26px 20px;border-radius:0 0 24px 24px}
.brand{font-size:32px;font-weight:bold}
.slogan{margin-top:7px;font-size:14px}
.card{margin:15px;padding:17px;border:1px solid #e5ebed;border-radius:17px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,input,select,textarea{font:inherit}
input,select,textarea{width:100%;padding:13px;border:1px solid #d5dfe1;border-radius:11px}
.form{display:grid;gap:10px}
.primary{background:#0f766e;color:white;border:0;border-radius:11px;padding:14px;font-weight:bold}
.cat{padding:15px;border:0;border-radius:12px;background:#eef8f7;color:#075e59}
.screen{display:none}
.screen.active{display:block}
.nav{position:sticky;bottom:0;display:flex;background:white;border-top:1px solid #ddd;padding:8px}
.nav button{flex:1;border:0;background:white;padding:10px;color:#555}
.nav button.active{color:#0f766e;font-weight:bold}
.tech{border:1px solid #e5ebed;padding:13px;border-radius:12px;margin-top:10px}
.muted{font-size:13px;color:#718096;margin-top:5px}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:10px;border:0;border-radius:10px}
.call{background:#0f766e;color:white}
.wa{background:#e9f8ee;color:#19713a}
.back{background:none;border:0;color:#0f766e;padding:0 0 12px}
#msg{overflow-wrap:anywhere;font-size:14px}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">فزعة</div>
<div class="slogan">الفني اللي تحتاجه .. بوقت تحتاجه</div>
</header>

<section id="home" class="screen active">
<div class="card">
<h2>شنو تحتاج اليوم؟</h2>
<input id="search" placeholder="ابحث عن كهربائي، سباك، تبريد...">
<div class="cats" style="margin-top:12px">
<button class="cat" onclick="filterCat('كهرباء')">⚡ كهرباء</button>
<button class="cat" onclick="filterCat('تبريد')">❄️ تبريد وتكييف</button>
<button class="cat" onclick="filterCat('سباكة')">🔧 سباكة</button>
<button class="cat" onclick="filterCat('موبايل')">📱 موبايل</button>
<button class="cat" onclick="filterCat('نجارة')">🪚 نجارة</button>
<button class="cat" onclick="filterCat('تنظيف')">🧹 تنظيف</button>
</div>
</div>
<div class="card">
<h2>الفنيون</h2>
<div id="list"></div>
<p class="muted">الفنيون الظاهرون حالياً أمثلة تجريبية.</p>
</div>
</section>

<section id="request" class="screen">
<div class="card">
<button class="back" onclick="show('home')">← رجوع</button>
<h2>طلب خدمة</h2>
<div class="form">
<input id="rname" placeholder="اسمك">
<input id="rphone" type="tel" placeholder="رقم الهاتف">
<select id="rtype">
<option>كهرباء</option>
<option>تبريد</option>
<option>سباكة</option>
<option>موبايل</option>
<option>نجارة</option>
<option>تنظيف</option>
</select>
<textarea id="rdesc" rows="4" placeholder="اكتب شنو تحتاج"></textarea>
<button id="sendBtn" class="primary" onclick="submitRequest()">إرسال الطلب</button>
<div id="msg" role="status"></div>
</div>
</div>
</section>

<section id="account" class="screen">
<div class="card">
<h2>حسابي</h2>
<div class="form">
<input id="aname" placeholder="الاسم">
<input id="aphone" placeholder="رقم الهاتف">
<select id="arole">
<option value="customer">زبون</option>
<option value="tech">فني</option>
</select>
<button class="primary" onclick="saveAccount()">حفظ الحساب على هذا الجهاز</button>
<div id="accountMsg" class="muted"></div>
</div>
</div>
<div class="card">
<h3>إضافة فني تجريبي</h3>
<div class="form">
<input id="tname" placeholder="اسم الفني أو المحل">
<input id="tphone" placeholder="رقم الهاتف">
<input id="tservice" placeholder="الخدمة">
<input id="tarea" placeholder="المنطقة">
<button class="primary" onclick="addTech()">إضافة فني</button>
</div>
</div>
</section>

<div class="nav">
<button class="active" data-s="home" onclick="show('home')">🏠 الرئيسية</button>
<button data-s="request" onclick="show('request')">📋 طلب خدمة</button>
<button data-s="account" onclick="show('account')">👤 حسابي</button>
</div>
</div>

<script>

const FIRESTORE_URL =
'https://firestore.googleapis.com/v1/projects/fazaa-app-581d/databases/(default)/documents/requests?key=apiKey';


let techs=[
{name:"علي للتبريد والتكييف",service:"تبريد",area:"البصرة",phone:"07700000001",rating:"4.9"},
{name:"كهربائي أبو حسن",service:"كهرباء",area:"البصرة",phone:"07700000002",rating:"4.8"},
{name:"سباك البصرة",service:"سباكة",area:"البصرة",phone:"07700000003",rating:"4.7"},
{name:"موبايل ستور",service:"موبايل",area:"البصرة",phone:"07700000004",rating:"4.9"}
];

const list=document.getElementById('list');

function render(q="",cat=""){
const filtered=techs.filter(t=>
(!q||Object.values(t).join(" ").includes(q))&&
(!cat||t.service===cat)
);
list.innerHTML=filtered.map(t=>`
<div class="tech">
<strong>${escapeHTML(t.name)}</strong>
<div class="muted">${escapeHTML(t.service)} • ${escapeHTML(t.area)} • ⭐ ${t.rating}</div>
<div class="btns">
<button class="btn call" onclick="callTech('${t.phone}')">اتصال</button>
<button class="btn wa" onclick="whatsappTech('${t.phone}')">واتساب</button>
</div>
</div>`).join("")||'<p class="muted">ماكو نتائج حالياً.</p>';
}

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}
function callTech(phone){location.href='tel:'+phone}
function whatsappTech(phone){
location.href='https://wa.me/964'+phone.replace(/^0/,'');
}
function filterCat(c){show('home');render("",c)}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));

function show(id){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.querySelectorAll('.nav button').forEach(x=>
x.classList.toggle('active',x.dataset.s===id)
);
window.scrollTo(0,0);
}

async function submitRequest(){
const msg=document.getElementById('msg');
const btn=document.getElementById('sendBtn');
const name=document.getElementById('rname').value.trim();
const phone=document.getElementById('rphone').value.trim();
const service=document.getElementById('rtype').value;
const description=document.getElementById('rdesc').value.trim();

if(!name||!phone||!description){
msg.textContent='املأ الاسم ورقم الهاتف ووصف الطلب أولاً.';
return;
}

btn.disabled=true;
msg.textContent='جاري إرسال الطلب...';

try{
const response=await fetch(FIRESTORE_URL,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
fields:{
name:{stringValue:name},
phone:{stringValue:phone},
service:{stringValue:service},
description:{stringValue:description},
createdAt:{timestampValue:new Date().toISOString()}
}
})
});

const result=await response.json();

if(!response.ok){
console.error('Firebase error:',result);
throw new Error(result.error?.message||('HTTP '+response.status));
}

msg.textContent='تم إرسال الطلب بنجاح ✅';
document.getElementById('rname').value='';
document.getElementById('rphone').value='';
document.getElementById('rdesc').value='';

}catch(error){
console.error('Fazaa error:',error);
msg.textContent='فشل الحفظ: '+error.message;
}finally{
btn.disabled=false;
}
}

function saveAccount(){
const a={
name:document.getElementById('aname').value.trim(),
phone:document.getElementById('aphone').value.trim(),
role:document.getElementById('arole').value
};
localStorage.setItem('fazaaAccount',JSON.stringify(a));
document.getElementById('accountMsg').textContent='تم حفظ الحساب على هذا الجهاز ✅';
}

function addTech(){
techs.push({
name:document.getElementById('tname').value||"فني جديد",
service:document.getElementById('tservice').value||"خدمات",
area:document.getElementById('tarea').value||"العراق",
phone:document.getElementById('tphone').value||"07700000000",
rating:"جديد"
});
render();
alert("تمت إضافة الفني تجريبياً. الإضافة ليست محفوظة على الإنترنت.");
}

render();
</script>
</body>
</html>
